[build]
  command = "npm ci && npm run web:build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # These EXPO_PUBLIC_* values are intentionally embedded in the public FCM Web config.
  # They are not Firebase Admin/service-account credentials.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_FIREBASE_VAPID_KEY"

[[redirects]]
  from = "/mamede"
  to = "/mamede/index.html"
  status = 200

[[redirects]]
  from = "/mamede/*"
  to = "/mamede/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
